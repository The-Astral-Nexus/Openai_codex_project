# Dependency Review Action
#
# This Action scans dependency manifest files changed in a Pull Request,
# surfacing known-vulnerable versions of packages declared or updated in the PR.
#
# Source repository: https://github.com/actions/dependency-review-action
# Documentation: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review

name: 'Dependency review'

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write # Required for `comment-summary-in-pr: always`

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: always
          # fail-on-severity: moderate
          # deny-licenses: GPL-1.0-or-later, LGPL-2.0-or-later
          # retry-on-snapshot-warnings: true
